services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autosmartml-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_PORT=5000
      - FLASK_DEBUG=False
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CORS_ORIGINS=*
      - MAX_CONTENT_LENGTH=33554432
    volumes:
      - backend-storage:/app/storage
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autosmartml-frontend
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-storage:
